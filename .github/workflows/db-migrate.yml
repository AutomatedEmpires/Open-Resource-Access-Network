name: Database Migration Safety Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - '.github/workflows/db-migrate.yml'
      - 'docs/ops/core/DATABASE_MIGRATION_BASELINE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migration-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-gate:
    name: Remote migration blocked pending verified baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout migration source
        uses: actions/checkout@v6

      - name: Inventory committed migrations without executing them
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t migrations < <(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo 'No committed SQL migrations were found.' >&2
            exit 1
          fi

          {
            echo '## Database migration safety gate'
            echo
            echo "- Committed SQL files: ${#migrations[@]}"
            echo '- Remote execution: disabled'
            echo '- Provider credentials requested: none'
            echo '- Required next step: verify a backup, disposable schema replay, normalized schema diff, and baseline ledger'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed on manual migration requests
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo '::error title=Remote migrations are intentionally blocked::The live schema is not represented by a verified repository ledger. This workflow cannot create a ledger, retrieve credentials, or execute SQL until the baseline procedure in docs/ops/core/DATABASE_MIGRATION_BASELINE.md is completed.'
          exit 1
