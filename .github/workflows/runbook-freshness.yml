name: Runbook Freshness

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/ops/**'
      - 'src/app/api/**'
      - 'src/services/**'
      - 'db/migrations/**'
      - 'functions/**'
      - 'infra/**'
      - 'vercel.json'
      - '.env.example'
      - '.github/runtime/**'
      - 'scripts/check-runbook-freshness.mjs'
      - 'src/__tests__/scripts/check-runbook-freshness.test.ts'
      - '.github/workflows/runbook-freshness.yml'
  push:
    branches: [main]
    paths:
      - 'docs/ops/**'
      - 'src/app/api/**'
      - 'src/services/**'
      - 'db/migrations/**'
      - 'functions/**'
      - 'infra/**'
      - 'vercel.json'
      - '.env.example'
      - '.github/runtime/**'
      - 'scripts/check-runbook-freshness.mjs'
      - 'src/__tests__/scripts/check-runbook-freshness.test.ts'
      - '.github/workflows/runbook-freshness.yml'
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Validate runbook review dates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test runbook governance checker
        run: npx vitest run src/__tests__/scripts/check-runbook-freshness.test.ts

      - name: Check runbook freshness
        run: node scripts/check-runbook-freshness.mjs
