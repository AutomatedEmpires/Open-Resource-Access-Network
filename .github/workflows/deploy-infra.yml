name: Deploy Infrastructure (Bicep)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      whatIf:
        description: 'Preview only (what-if mode)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run What-If preview
        if: ${{ inputs.whatIf }}
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              prefix="${{ vars.ORAN_PREFIX || 'oran' }}" \
              environment="${{ inputs.environment }}" \
              pgAdminPassword="${{ secrets.PG_ADMIN_PASSWORD }}" \
              nextAuthSecret="${{ secrets.NEXTAUTH_SECRET }}" \
              internalApiKey="${{ secrets.INTERNAL_API_KEY }}" \
              azureMapsSasToken="${{ secrets.AZURE_MAPS_SAS_TOKEN }}" \
              entraClientId="${{ vars.AZURE_AD_CLIENT_ID || '' }}" \
              entraClientSecret="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
              entraTenantId="${{ vars.AZURE_AD_TENANT_ID || '' }}" \
              sentryDsn="${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}" \
              customHostname="${{ vars.ORAN_CUSTOM_HOSTNAME || '' }}"

      - name: Deploy infrastructure
        if: ${{ !inputs.whatIf }}
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              prefix="${{ vars.ORAN_PREFIX || 'oran' }}" \
              environment="${{ inputs.environment }}" \
              pgAdminPassword="${{ secrets.PG_ADMIN_PASSWORD }}" \
              nextAuthSecret="${{ secrets.NEXTAUTH_SECRET }}" \
              internalApiKey="${{ secrets.INTERNAL_API_KEY }}" \
              azureMapsSasToken="${{ secrets.AZURE_MAPS_SAS_TOKEN }}" \
              entraClientId="${{ vars.AZURE_AD_CLIENT_ID || '' }}" \
              entraClientSecret="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
              entraTenantId="${{ vars.AZURE_AD_TENANT_ID || '' }}" \
              sentryDsn="${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}" \
              customHostname="${{ vars.ORAN_CUSTOM_HOSTNAME || '' }}" \
            --query "properties.outputs" -o json

      - name: Bind custom hostname and managed TLS
        if: ${{ !inputs.whatIf && vars.ORAN_CUSTOM_HOSTNAME != '' }}
        env:
          CUSTOM_HOSTNAME: ${{ vars.ORAN_CUSTOM_HOSTNAME }}
          CONFIGURED_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ORAN_PREFIX: ${{ vars.ORAN_PREFIX || 'oran' }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          webapp_name="$CONFIGURED_WEBAPP_NAME"
          if [ -z "$webapp_name" ]; then
            webapp_name="${ORAN_PREFIX}-${TARGET_ENVIRONMENT}-web"
          fi

          existing_hostname=$(az webapp config hostname list \
            --resource-group "$RESOURCE_GROUP" \
            --webapp-name "$webapp_name" \
            --query "[?name=='$CUSTOM_HOSTNAME'].name | [0]" -o tsv)
          if [ -z "$existing_hostname" ]; then
            az webapp config hostname add \
              --resource-group "$RESOURCE_GROUP" \
              --webapp-name "$webapp_name" \
              --hostname "$CUSTOM_HOSTNAME" \
              --output none
          fi

          thumbprint=$(az webapp config ssl list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?contains(hostNames, '$CUSTOM_HOSTNAME')].thumbprint | [0]" -o tsv)
          if [ -z "$thumbprint" ]; then
            thumbprint=$(az webapp config ssl create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$webapp_name" \
              --hostname "$CUSTOM_HOSTNAME" \
              --query thumbprint -o tsv)
          fi
          if [ -z "$thumbprint" ]; then
            echo "::error::Azure did not return a managed-certificate thumbprint."
            exit 1
          fi

          az webapp config ssl bind \
            --resource-group "$RESOURCE_GROUP" \
            --name "$webapp_name" \
            --certificate-thumbprint "$thumbprint" \
            --ssl-type SNI \
            --output none

      - name: Show deployment outputs
        if: ${{ !inputs.whatIf }}
        run: |
          az deployment group show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name main \
            --query "properties.outputs.{webApp:webAppUrl.value,funcApp:funcAppUrl.value,keyVault:keyVaultName.value,postgres:pgServerFqdn.value}" \
            -o table
