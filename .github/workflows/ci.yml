name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Limit GITHUB_TOKEN permissions to minimum required
permissions:
  contents: read

jobs:
  migrations:
    name: Migration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Mirrors production: the same Supabase image ORAN runs on, so PostGIS and
    # pgvector are the versions the live project actually has and the conditional
    # pgvector branch in 0026 is exercised rather than skipped.
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.131
        env:
          # Throwaway credential for an ephemeral, network-isolated CI container.
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: oran_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oran_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify migrations against a fresh database
        run: npm run verify:migrations
        env:
          MIGRATION_DATABASE_URL: postgresql://supabase_admin:pw@127.0.0.1:5432/oran_ci_test

  runtime-readiness:
    name: Runtime Readiness Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate committed production webapp env contract
        run: |
          node scripts/validate-runtime-env.mjs \
            --target webapp \
            --names-file .github/runtime/webapp-production-settings.txt \
            --node-env production \
            --format github \
            --require-warning NEXT_PUBLIC_SENTRY_DSN \
            --require-warning NEXT_PUBLIC_SUPABASE_URL \
            --require-warning NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --require-warning NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
            --require-warning CLERK_SECRET_KEY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [runtime-readiness, lint, typecheck, test]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  ui-consistency:
    name: UI Consistency Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run UI consistency audit (report-only, non-blocking)
        run: npm run audit:ui >> $GITHUB_STEP_SUMMARY
