version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # vite majors are blocked by @storybook/react-vite@8 (peer: vite ^4||^5||^6).
      # Remove this once Storybook is upgraded to a release that supports vite 7+.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      drizzle:
        patterns:
          - "drizzle-*"
          - "drizzle-orm"
      test:
        patterns:
          - "vitest"
          - "@vitest/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
